name: Apply exact reviewed Portable slice
on:
  push:
    branches: [review/portable-bootstrap-minimal-homes-20261030]
    paths: ['.paos-review/edits.*']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact local candidate and check tree identity
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, tempfile
          from pathlib import Path
          base = '9066765f99d1fae9593e05dc26a12b47af42ac6c'
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs)
          assert git('rev-parse', 'HEAD^', text=True).strip() == base, 'Unexpected parent; do not rebase automatically'
          packed = base64.b64decode(''.join((Path('.paos-review') / f'edits.{i}').read_text() for i in range(3)), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '053e85422c522486a6524ee3aaaee5606c35132997970c12b67243e140c35bc7'
          data = lzma.decompress(packed)
          assert hashlib.sha256(data).hexdigest() == '025e8cc1198c8c64b919e63cfe37c33f4247034163f77433d70972359d07dc30'
          entries = json.loads(data)
          assert len(entries) == 24
          for name, edits in entries:
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts and not name.startswith('.github/')
              if edits is None:
                  path.unlink()
                  continue
              previous = subprocess.run(['git', 'show', base + ':' + name], capture_output=True)
              lines = previous.stdout.decode('utf-8').splitlines(keepends=True) if previous.returncode == 0 else []
              for start, end, replacement in reversed(edits):
                  lines[start:end] = replacement.splitlines(keepends=True)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(''.join(lines), encoding='utf-8', newline='\n')
          for i in range(3):
              (Path('.paos-review') / f'edits.{i}').unlink()
          Path('.paos-review').rmdir()
          git('add', '-A')
          git('diff', '--cached', '--check')
          staged = git('write-tree', text=True).strip()
          fd, index = tempfile.mkstemp(); os.close(fd); os.unlink(index)
          env = dict(os.environ, GIT_INDEX_FILE=index)
          try:
              git('read-tree', staged, env=env)
              git('update-index', '--force-remove', '.github/workflows/apply-portable-slice.yml', env=env)
              actual = git('write-tree', env=env, text=True).strip()
              assert actual == '9a4594b86835ebf987ec448749e1c24ae37953d0', actual
          finally:
              Path(index).unlink(missing_ok=True)
          print('Exact reviewed code tree verified:', actual)
          PY
      - name: Run current full Portable verifier
        run: python code/personal-agent-os/scripts/verify.py
      - name: Publish only to the same unchanged review branch
        shell: bash
        env:
          REVIEW_BRANCH: review/portable-bootstrap-minimal-homes-20261030
        run: |
          git diff --exit-code
          remote=$(git ls-remote origin "refs/heads/$REVIEW_BRANCH" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(portable): make the Agent work loop file-backed and retire legacy management surfaces'
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
          git rev-parse HEAD

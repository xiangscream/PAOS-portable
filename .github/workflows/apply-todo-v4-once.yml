name: Apply reviewed PAOS TODO v4 slice once
on:
  push:
    branches:
      - review/portable-bootstrap-minimal-homes-20261030
    paths:
      - .github/workflows/apply-todo-v4-once.yml

permissions:
  contents: write

jobs:
  apply-reviewed-slice:
    if: github.event.head_commit.message == 'ci(todo): apply reviewed patch once'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source and patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3f37d2e9292e3bf05767fa18b40ce227694a59b2"
          base64 -d docs/transfer/paos-todo-v4.patch.xz.b64 > /tmp/paos-todo-v4.patch.xz
          echo '85cfaa6453e85097f28a5369f3b7614f31352750a83db6e74dbe1e5ca98e4ea7  /tmp/paos-todo-v4.patch.xz' | sha256sum -c -
          xz -dc /tmp/paos-todo-v4.patch.xz > /tmp/paos-todo-v4.patch
          git apply --check /tmp/paos-todo-v4.patch
          git apply /tmp/paos-todo-v4.patch
          rm .github/workflows/apply-todo-v4-once.yml docs/transfer/paos-todo-v4.patch.xz.b64
          rmdir docs/transfer 2>/dev/null || true
          python code/personal-agent-os/scripts/verify.py
          git add -A
          test "$(git write-tree)" = "81499bf3be17c2535c7c08e448bdf08cedeb4b92"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(todo): native Markdown Pinned Current Tasks with single checkbox states'
          git push origin HEAD:refs/heads/review/portable-bootstrap-minimal-homes-20261030
